<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · GlideUp</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font-family: system-ui, sans-serif;
             background: #f6f9fc; color: #0f172a; text-align: center; padding: 16px; }
      @media (prefers-color-scheme: dark) { body { background: #0b1220; color: #e2e8f0; } }
      img { width: 56px; height: 56px; }
      button { margin-top: 16px; padding: 10px 18px; border-radius: 8px; border: 0; background: #1d6fb8; color: #fff; font-size: 15px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/logo.svg" alt="" />
      <h1>You're offline</h1>
      <p>GlideUp needs a connection for jobs, interviews and tests. Your work is saved on our side.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
