[project]
name = "glideup-backend"
version = "0.1.0"
description = "GlideUp API — find jobs, practice interviews, get hired."
authors = [{ name = "Sahil Thakur" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "redis>=5.2",
    "celery[redis]>=5.4",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "structlog>=24.4",
    "prometheus-fastapi-instrumentator>=7.0",
    "pdfplumber>=0.11.10",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "boto3>=1.43.106",
    "jinja2>=3.1.6",
    "nh3>=0.3.7",
    "meilisearch-python-sdk>=7.5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "aiosqlite>=0.20",
    "ruff>=0.8",
    "mypy>=1.13",
    "celery-types>=0.22",
    "pre-commit>=4.0",
    "boto3-stubs[s3]>=1.43.106",
    "reportlab>=5.0.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "SIM", "RUF", "C4", "PT", "TID"]
ignore = ["B008"] # FastAPI's Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["app/db/migrations/"]

[[tool.mypy.overrides]]
module = ["celery.*", "prometheus_fastapi_instrumentator.*", "reportlab.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]
omit = ["app/db/migrations/*", "app/scripts/*"]
