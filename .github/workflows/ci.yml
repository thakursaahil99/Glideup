name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: glideup
          POSTGRES_PASSWORD: glideup
          POSTGRES_DB: glideup
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U glideup" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://glideup:glideup@localhost:5432/glideup
      TEST_DATABASE_URL: postgresql+asyncpg://glideup:glideup@localhost:5432/glideup_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff
        run: uv run ruff format --check . && uv run ruff check .
      - name: Mypy (strict)
        run: uv run mypy app tests
      - name: Migrations apply cleanly and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Create test database
        run: PGPASSWORD=glideup psql -h localhost -U glideup -c "CREATE DATABASE glideup_test"
      - name: Tests (Postgres)
        run: uv run pytest --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=80
      - name: OpenAPI schema is up to date
        run: |
          uv run python -m app.scripts.export_openapi ../frontend/openapi.json
          git diff --exit-code -- ../frontend/openapi.json

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generated API types are up to date
        run: npm run gen:api && git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          AUTH_SECRET: ci-build-placeholder

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose build
